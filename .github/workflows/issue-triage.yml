name: Issue Triage
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read
  models: read    # required for the github.token AI_TOKEN default to call GitHub Models

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: qte77/gha-issue-triage@cc8f0cf99014af906ea3ad1ee977d92852069579  # v0.2.4
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AI_TOKEN omitted → defaults to github.token (covered by models: read above)
          # MODEL omitted → openai/gpt-4.1 default
