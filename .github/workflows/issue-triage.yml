name: Issue Triage
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read
  models: read    # required for the github.token AI_TOKEN default to call GitHub Models

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: qte77/gha-issue-triage@4b617128c81fc7b78d94695eba0f06c6c1ee7146  # main @ 2026-05-14
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AI_TOKEN omitted → defaults to github.token (covered by models: read above)
          # MODEL omitted → openai/gpt-4.1 default
