[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipettebot"
version = "0.0.1"
description = "Anycubic i3 Mega + DLAB dPette: a sub-$300 disposable-tip pipetting robot"
readme = "README.md"
license = "Apache-2.0"
# Pin upper bound: build123d → cadquery-ocp → VTK has no cp313 wheels (verified 2026-04)
requires-python = ">=3.11,<3.13"
keywords = [
    "pipette",
    "lab-automation",
    "liquid-handling",
    "i3-mega",
    "marlin",
    "dpette",
    "3d-printer",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyserial>=3.5,<4",
    "dpette @ git+https://github.com/Lambda-Biolab/dpette-usb-driver.git@5cc90ca18d047dcdc0b5e99ac678183980ed6b0e",
]

[project.urls]
Homepage = "https://github.com/qte77/i3mega-pipettebot"
Issues = "https://github.com/qte77/i3mega-pipettebot/issues"
"Companion driver" = "https://github.com/Lambda-Biolab/dpette-usb-driver"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-mock>=3.12,<4",
    "ruff>=0.4,<1",
    "mypy>=1.10,<3",
    "types-pyserial>=3.5",
    "complexipy>=0.8",
    "hypothesis>=6.100,<7",
]
cad = [
    "build123d>=0.10",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pipettebot"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "C90", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
"tests/*" = ["E501", "TC001", "TC002", "TC003", "S101"]   # assert is the pytest mechanism
"tools/cad/**" = ["E501", "ANN", "S603"]   # CAD scripts: dynamic build123d imports, subprocess calls
"tools/slicer/**" = ["S603"]               # subprocess calls run trusted slicer binaries

[tool.ruff.lint.isort]
known-first-party = ["pipettebot", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
exclude = [
    "tools/cad/",     # build123d uses dynamic imports without type stubs
    "tools/slicer/",  # subprocess wrapping; not strict-typed
]

[[tool.mypy.overrides]]
module = "dpette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "build123d.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not hardware\""
markers = [
    "hardware: requires physical i3 Mega + dPette hookup",
    "cad: requires build123d installed (uv sync --extra cad)",
]
