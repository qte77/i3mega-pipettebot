[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipettebot"
version = "0.1.0"
description = "Anycubic i3 Mega + DLAB dPette: a sub-$300 disposable-tip pipetting robot"
readme = "README.md"
license = "Apache-2.0"
# Pin upper bound: build123d → cadquery-ocp → VTK has no cp313 wheels (verified 2026-04)
requires-python = ">=3.11,<3.13"
keywords = [
    "pipette",
    "lab-automation",
    "liquid-handling",
    "i3-mega",
    "marlin",
    "dpette",
    "3d-printer",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyserial>=3.5,<4",
    "dpette @ git+https://github.com/Lambda-Biolab/dpette-usb-driver.git@5cc90ca18d047dcdc0b5e99ac678183980ed6b0e",
]

[project.urls]
Homepage = "https://github.com/qte77/i3mega-pipettebot"
Issues = "https://github.com/qte77/i3mega-pipettebot/issues"
"Companion driver" = "https://github.com/Lambda-Biolab/dpette-usb-driver"
"Orchestrator companion" = "https://github.com/qte77/so101-biolab-automation"

[project.scripts]
pipettebot-capture-position = "pipettebot.so101.capture_position:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-mock>=3.12,<4",
    "ruff>=0.4,<1",
    "mypy>=1.10,<3",
    "types-pyserial>=3.5",
    "complexipy>=0.8",
    "hypothesis>=6.100,<7",
]
cad = [
    "build123d>=0.10",
]
orchestrator = [
    # so101 requires Python 3.12+; gate the marker so `uv sync --extra
    # orchestrator` is a no-op on 3.11. Distribution name in so101's
    # pyproject is `so101-biolab-automation`; the import root is `so101`.
    "so101-biolab-automation @ git+https://github.com/qte77/so101-biolab-automation.git@main ; python_version >= '3.12'",
]
teaching = [
    # feetech-servo-sdk: STS3215 SDK (provides the `scservo_sdk` Python
    # module) for the lean leader-follower teleop in
    # `tools/teleop_lean.py`. No torch, no lerobot. PyPI name is
    # `feetech-servo-sdk`; lerobot's `[feetech]` extra pulls the same
    # package. See issue qte77/so101-biolab-automation#160.
    "feetech-servo-sdk>=1.0.0,<2.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pipettebot"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Baseline + quality + strictness per py-harden-ruff.md section 1.
# Migrated TCH -> TC (rule rename).
select = [
    "E", "F", "I", "N", "W", "UP",        # baseline
    "B", "S", "SIM", "RUF", "PT", "A",    # quality
    "ANN", "TC", "PGH", "C90", "D",       # strictness
    "TRY",                                 # try/except discipline
]
ignore = [
    "TRY003",  # long error messages outside exception classes — noisy on one-off defensive raises
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Examples are operator-facing scripts with intentional unicode (× for
# multiplication, – for en-dashes) in documentation; over-annotating is noise.
"examples/*" = ["E501", "D", "ANN", "RUF001", "RUF002", "RUF003"]
# Tests use pytest's assert mechanism; annotation discipline is not enforced
# (tests are write-once, expressiveness over types). RUF unicode ignores
# match the examples/ convention (math notation in technical comments).
"tests/**" = ["E501", "TC001", "TC002", "TC003", "S101", "D", "ANN", "PT", "RUF001", "RUF002", "RUF003"]
# Bring-up scripts: operator-facing, not library code.
"tools/**" = ["D", "ANN", "RUF001", "RUF002", "RUF003"]
"tools/cad/**" = ["E501", "S603"]      # CAD: dynamic build123d imports, subprocess calls
"tools/slicer/**" = ["S603"]           # subprocess calls run trusted slicer binaries

[tool.ruff.lint.isort]
known-first-party = ["pipettebot", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
exclude = [
    "tools/cad/",     # build123d uses dynamic imports without type stubs
    "tools/slicer/",  # subprocess wrapping; not strict-typed
]
# Note: `[[tool.mypy.overrides]]` for dpette and build123d were removed
# because `src/` (the only path mypy checks) imports neither. Re-add them
# alongside any future src import of those packages.

[[tool.mypy.overrides]]
module = "so101.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not hardware\""
markers = [
    "hardware: requires physical i3 Mega + dPette hookup",
    "cad: requires build123d installed (uv sync --extra cad)",
]

[tool.uv]
# Cap the resolver to releases published on or before this date so CI and
# fresh clones get the same versions regardless of when they run. Bump this
# when you want to take newer wheels.
exclude-newer = "2026-05-17T00:00:00Z"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false
