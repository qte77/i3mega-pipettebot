# PrusaSlicer profile: PLA+ 0.2 mm layer height, Prusa MK4 bed.
# Bed dimensions per user: 250 mm (X) x 220 mm (Y).
# Note: Prusa's own MK4 spec sheet says 250 x 210 x 220 (X x Y x Z);
# this profile uses Y=220 per user (slightly bigger than stock Y=210).

[print]
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
fill_density = 15%
support_material = 0
detect_thin_wall = 1
overhangs = 1

[filament]
filament_type = PLA
temperature = 210
bed_temperature = 60

[printer]
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x220,0x220
# Binary G-code (.bgcode) for MK4 firmware — smaller and natively supported.
binary_gcode = 1
