# PrusaSlicer profile: PLA+ 0.2 mm layer height, Prusa MK3S+-class bed (220 × 220).
# Ported from so101-biolab-automation for parity — mount fabrication happens
# elsewhere on a Prusa-class machine, not on the stripped i3 Mega.
# Export from PrusaSlicer GUI, then load via: prusa-slicer --load this_file.ini
# Minimal settings; sufficient for both printability validation and real prints
# (start_gcode below ensures the bed heats — without it the slicer emits only
# nozzle heat and the first layer won't stick).

[print]
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
fill_density = 15%
support_material = 0
detect_thin_wall = 1
overhangs = 1

[filament]
filament_type = PLA
temperature = 210
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60

[printer]
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
start_gcode = M140 S[first_layer_bed_temperature] ; set bed temp\nM104 S[first_layer_temperature] ; set nozzle temp\nG28 ; home all axes\nM190 S[first_layer_bed_temperature] ; wait for bed\nM109 S[first_layer_temperature] ; wait for nozzle\nG92 E0
end_gcode = M104 S0 ; nozzle off\nM140 S0 ; bed off\nG91\nG1 Z10 F600\nG90\nG28 X Y\nM84 ; motors off
