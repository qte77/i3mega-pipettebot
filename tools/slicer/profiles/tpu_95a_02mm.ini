# PrusaSlicer profile: TPU 95A 0.2 mm layer height, Prusa MK3S+-class bed.
# Ported from so101-biolab-automation. For flexible-material parts (none in
# our v0 manifest yet; reserved for future compliant clamp pads).
# Export from PrusaSlicer GUI, then load via: prusa-slicer --load this_file.ini

[print]
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
fill_density = 20%
support_material = 0
detect_thin_wall = 1
overhangs = 1

[filament]
filament_type = FLEX
temperature = 230
bed_temperature = 50

[printer]
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
