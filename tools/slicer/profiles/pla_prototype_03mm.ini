# PrusaSlicer profile: PLA prototype, 0.3 mm layer height.
# Quick form-fit-function passes on a Prusa MK4. Not for production:
# rougher layer lines, lighter infill, faster speeds, brim for first-
# layer adhesion on wide flat parts. Use `pla_plus_02mm.ini` (MK3S+)
# or `pla_plus_02mm_mk4.ini` for production.
#
# Per slicer-profile rule: bed_shape and binary_gcode must be passed
# as CLI flags (`--bed-shape ...`, `--binary-gcode`) — PrusaSlicer 2.9
# does not reliably load them from a minimal .ini via `--load`.

[print]
layer_height = 0.3
first_layer_height = 0.2
perimeters = 2
fill_density = 10%
support_material = 0
detect_thin_wall = 1
overhangs = 1
brim_width = 5
perimeter_speed = 80
infill_speed = 100
travel_speed = 150

[filament]
filament_type = PLA
temperature = 215
bed_temperature = 60

[printer]
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x220,0x220
binary_gcode = 1
