# Anycubic i3 Mega — PETG, 0.2mm layer height
# Use for parts near solvent splash or where PLA's heat tolerance is marginal.
# Compatible with both OrcaSlicer and PrusaSlicer.

# --- Printer (Anycubic i3 Mega stock) ---
printer_model = ANYCUBIC_I3MEGA
nozzle_diameter = 0.4
bed_shape = 0x0,210x0,210x210,0x210
max_print_height = 205
gcode_flavor = marlin

# --- Filament (PETG) ---
filament_type = PETG
filament_diameter = 1.75
temperature = 240
first_layer_temperature = 245
bed_temperature = 75
first_layer_bed_temperature = 75
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 50
disable_fan_first_layers = 2

# --- Print quality (0.2mm layer) ---
layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = gyroid

# --- Supports / brim ---
support_material = 0
support_material_threshold = 50
brim_width = 6
brim_type = outer_only
skirts = 1
skirt_distance = 5

# --- Speeds (slower than PLA — PETG strings if rushed) ---
perimeter_speed = 35
external_perimeter_speed = 22
infill_speed = 50
solid_infill_speed = 35
top_solid_infill_speed = 25
travel_speed = 120
first_layer_speed = 18

# --- Retraction (longer than PLA — PETG strings) ---
retract_length = 4.0
retract_speed = 35
retract_lift = 0.4
wipe = 1
