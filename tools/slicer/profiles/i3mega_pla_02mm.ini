# Anycubic i3 Mega — PLA+, 0.2mm layer height
# Compatible with both OrcaSlicer and PrusaSlicer (PrusaSlicer-derived schema).
# Hardware reference: stock AI3M, no enclosed chamber, MK8-style direct-drive carriage.

# --- Printer (Anycubic i3 Mega stock) ---
printer_model = ANYCUBIC_I3MEGA
nozzle_diameter = 0.4
bed_shape = 0x0,210x0,210x210,0x210
max_print_height = 205
gcode_flavor = marlin
extruder_offset = 0x0
single_extruder_multi_material = 0

# --- Filament (PLA+) ---
filament_type = PLA
filament_diameter = 1.75
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
filament_cooling_moves = 4
fan_always_on = 1
min_fan_speed = 35
max_fan_speed = 100
disable_fan_first_layers = 1

# --- Print quality (0.2mm layer) ---
layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
external_perimeters_first = 0
ensure_vertical_shell_thickness = 1
gap_fill_enabled = 1

# --- Supports / brim (defaults; per-part overrides via slicer plate) ---
support_material = 0
support_material_threshold = 45
support_material_pattern = rectilinear
support_material_spacing = 2.5
brim_width = 4
brim_type = outer_only
skirts = 1
skirt_distance = 4

# --- Speeds (conservative for the AI3M's stock acoustic resonance) ---
perimeter_speed = 40
external_perimeter_speed = 25
infill_speed = 60
solid_infill_speed = 40
top_solid_infill_speed = 30
travel_speed = 120
first_layer_speed = 20
support_material_speed = 40

# --- Retraction (Bowden-like for direct-drive) ---
retract_length = 1.5
retract_speed = 35
retract_lift = 0.2
wipe = 1
