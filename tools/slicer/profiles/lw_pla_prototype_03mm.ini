# PrusaSlicer profile: ColorFabb LW-PLA (foaming) prototype on Prusa MK4.
# LW-PLA expands when heated; uses lower extrusion multiplier so the
# foam fills the gap. Slow speeds let the foaming chemistry develop.
#
# Source guide: https://colorfabb.com/lw-pla-natural-750gr
# Reference settings:
#   - temperature 230 deg C   (moderate foaming; 220-250 range)
#   - extrusion_multiplier 0.7 (LW-PLA expands ~1.5-2x)
#   - perimeter speed 30 mm/s  (slow; foaming needs time)
#
# Per slicer-profile rule: PrusaSlicer 2.9 CLI does not reliably load
# minimal .ini settings via --load; pass critical keys as CLI flags
# (--bed-shape, --binary-gcode, --gcode-flavor, --thumbnails, speeds).

[print]
layer_height = 0.3
first_layer_height = 0.2
perimeters = 2
fill_density = 10%
support_material = 0
detect_thin_wall = 1
overhangs = 1
brim_width = 5
perimeter_speed = 30
external_perimeter_speed = 25
infill_speed = 40
travel_speed = 130
first_layer_speed = 20

[filament]
filament_type = PLA
temperature = 230
bed_temperature = 55
extrusion_multiplier = 0.7

[printer]
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x220,0x220
binary_gcode = 1
gcode_flavor = marlinfirmware
printer_model = MK4
thumbnails = 220x124/PNG,16x16/PNG
